name: CI/CD Pipeline

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'outboxml/app/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f outboxml/app/requirements.txt ]; then
          pip install -r outboxml/app/requirements.txt
        else
          echo "⚠️ requirements.txt not found at outboxml/app/requirements.txt"
          exit 1
        fi
        # Устанавливаем coverage для тестов
        pip install coverage

    - name: Run tests with coverage
      run: |
        coverage run -m unittest discover -s tests

    - name: Generate coverage report
      run: |
        coverage report
        coverage xml

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: |
          coverage.xml
        retention-days: 7